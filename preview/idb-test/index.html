<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>项目5 · 原生 IndexedDB 行为验收（隔离测试站点）</title>
</head>
<body>
<!-- ============================================================
     preview/idb-test/index.html — 原生 IndexedDB 行为验收入口
     · 隔离测试站点：跑在本地 http（serve.js）+ playwright 一次性浏览器
       profile 里，**不读写用户真实浏览器存档**；
     · 被测对象是**生产源码原文**：/store.js 与 /memory-vec.js 经
       <script src> 从应用同源加载（不加壳、不改字）；
     · Sleepy.core / Sleepy.api（embedding mock，不产生真实费用）/
       Sleepy.singleApi 是环境桩，测试不经过它们的项目不依赖桩；
     · 场景由 ?case= 选择，pre 脚本负责布置 IDB / localStorage；
     · 部署安全：preview/ 整目录在 deploy.sh 的 --exclude 清单里，不会上线。
     ============================================================ -->
<script>
(function () {
  'use strict';
  var params = new URLSearchParams(location.search);
  var c = params.get('case') || 'upgrade';
  var NS = 'sleepy.v1.';

  function lsClearVec() {
    ['vecDbVer', 'vecRebuild', 'vecEpoch'].forEach(function (k) { localStorage.removeItem(NS + k); });
    var doomed = [];
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k && (k.indexOf(NS + 'vecCursor') === 0 || k.indexOf(NS + 'vecFail:') === 0)) doomed.push(k);
    }
    doomed.forEach(function (k) { localStorage.removeItem(k); });
  }
  function openDB(name, version) {
    return new Promise(function (res, rej) {
      var r = indexedDB.open(name, version);
      r.onupgradeneeded = function () {
        var db = r.result;
        if (db.objectStoreNames.contains('vec')) db.deleteObjectStore('vec');
        var os = db.createObjectStore('vec', { keyPath: 'id' });
        os.createIndex('ownerKey', 'ownerKey');
        os.createIndex('at', 'at');
      };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    });
  }
  function putBlocks(db, records) {
    return new Promise(function (res, rej) {
      var t = db.transaction('vec', 'readwrite');
      var os = t.objectStore('vec');
      records.forEach(function (r) { os.put(r); });
      t.oncomplete = function () { res(true); };
      t.onerror = function () { rej(t.error); };
    });
  }
  function blk(id, from, sb, owner) {
    return { id: id, ownerKey: owner || 'r1', charId: 'r1', fromCharId: from,
      sandboxId: sb, kind: 'chat', msgIds: [id], text: 'x', vec: [0.1], model: 'emb-test' };
  }
  /* 群块：ownerKey='group:<gid>'，块上带 groupId —— 项目3 purgeGroup 按它整池清 */
  function gblk(id, gid, sb) {
    return { id: id, ownerKey: 'group:' + gid, charId: null, fromCharId: null,
      groupId: gid, sandboxId: sb, kind: 'chat', msgIds: [id], text: 'x', vec: [0.1], model: 'emb-test' };
  }
  /* 项目4 全字段块：forgetHit 按 charId(root 归一)/fromCharId/userId/sandboxId 多维精确匹配。
     charId=null 表示「共享池/账号池」块（朋友圈 / user 日记），不带 char 维度。 */
  function p4blk(o) {
    return { id: o.id, ownerKey: o.ownerKey, charId: o.charId != null ? o.charId : null,
      fromCharId: o.fromCharId != null ? o.fromCharId : null,
      userId: o.userId != null ? o.userId : null,
      sandboxId: o.sandboxId, kind: o.kind || 'chat', msgIds: [o.id],
      text: 'x', vec: [0.1], model: 'emb-test' };
  }

  /* pre：按场景布置 IDB / localStorage。全部完成后才注入生产脚本。 */
  window.__pre = (async function () {
    if (c === 'upgrade') {
      /* v5 旧库 + 两块；localStorage 无任何升级痕迹（漏判场景） */
      var db = await openDB('sleepy-vec', 5);
      await putBlocks(db, [blk('old1', 'fA', 'sb1'), blk('old2', 'fB', 'sb1')]);
      db.close();
      lsClearVec();
    } else if (c === 'fresh') {
      /* 全新：删库重造 */
      await new Promise(function (res) { var r = indexedDB.deleteDatabase('sleepy-vec'); r.onsuccess = r.onerror = r.onblocked = res; });
      lsClearVec();
    } else if (c === 'resume' || c === 'wipe') {
      await new Promise(function (res) { var r = indexedDB.deleteDatabase('sleepy-vec'); r.onsuccess = r.onerror = r.onblocked = res; });
      lsClearVec();
    } else if (c === 'forget') {
      var db2 = await openDB('sleepy-vec', 6);
      await putBlocks(db2, [
        blk('b1', 'fA', 'sb1'), blk('b2', 'fB', 'sb1'),
        blk('b3', 'fA', 'sb2'), blk('b4', 'fA', 'sb1', 'island:sb1')
      ]);
      db2.close();
      lsClearVec();
    } else if (c === 'purge') {
      /* 项目3：解散群端到端。
         IDB：目标群 gid1 两块、参照群 gid2 一块、岛池/角色池/账号池各一块（全保留对照）。
         localStorage：三张主表（gid1 + gid2）、派生键、线下两数组。 */
      var db4 = await openDB('sleepy-vec', 6);
      await putBlocks(db4, [
        gblk('ga1', 'gid1', 'sb1'), gblk('ga2', 'gid1', 'sb1'),
        gblk('gb1', 'gid2', 'sb1'),
        blk('isl1', 'fA', 'sb1', 'island:sb1'),
        blk('rblk', 'fA', 'sb1', 'r1'),
        blk('ublk', 'fA', 'sb1', 'user:u1')
      ]);
      db4.close();
      lsClearVec();
      var ns = NS;
      var mk = function (id, extra) { var o = { id: id, sandboxId: 'sb1', name: '群' + id }; return extra ? Object.assign(o, extra) : o; };
      localStorage.setItem(ns + 'groups', JSON.stringify([mk('gid1'), mk('gid2')]));
      localStorage.setItem(ns + 'groupMembers', JSON.stringify([
        { groupId: 'gid1', accountId: 'A', kind: 'char', ownerId: 'A', role: 'owner', sandboxId: 'sb1' },
        { groupId: 'gid2', accountId: 'B', kind: 'char', ownerId: 'B', role: 'owner', sandboxId: 'sb1' }
      ]));
      localStorage.setItem(ns + 'groupMessages', JSON.stringify([
        { id: 'm1', groupId: 'gid1', senderAccountId: 'A', content: 'hi', sandboxId: 'sb1' },
        { id: 'm2', groupId: 'gid2', senderAccountId: 'B', content: 'yo', sandboxId: 'sb1' }
      ]));
      localStorage.setItem(ns + 'groupPending:gid1', JSON.stringify([1, 2]));
      localStorage.setItem(ns + 'groupInner:gid1', JSON.stringify({ x: 1 }));
      localStorage.setItem(ns + 'sumCursor:g:gid1', JSON.stringify({ at: 1 }));
      localStorage.setItem(ns + 'groupOfflineSessions', JSON.stringify([
        { groupId: 'gid1', status: 'active', sandboxId: 'sb1', location: '咖啡店' },
        { groupId: 'gid2', status: 'active', sandboxId: 'sb1', location: '公园' }
      ]));
      localStorage.setItem(ns + 'offlineHandoffs', JSON.stringify([
        { groupId: 'gid1', status: 'pending', sandboxId: 'sb1' },
        { groupId: 'gid2', status: 'pending', sandboxId: 'sb1' }
      ]));
    } else if (c === 'p4') {
      /* 项目4：四类删除的**向量出口**端到端（真块 + 隔离 + 跨岛保留）。
         只测 memoryVec 的 forgetSandbox / forgetCharSet / forgetUser ——
         core 的 purge 门禁/跨岛守卫/默认我保护已在 smoke 覆盖，这里不重复。
         两座岛（块忠实建模真实写入：charId=大脑 root、fromCharId=产出方，见 sweep 系列）：
           · sbA：大号 rA（皮套 fA1/fA2、NPC nA1/nA2 挂 rA、子NPC snA1 挂 fA1）+ 马甲 uA；
           · sbB：参照岛，含 **rA 系跨岛块** b1(fA1)/b2(rA)/b3(nA1)。
         断言要点（主表 doomed = 向量命中集合）：
           · forgetSandbox(sbA) 清 a1..a7、b1..b4 全留；
           · forgetCharSet({charIds:[nA1]},sbA) 只清 a4（nA1）：大号 rA(a1)、皮套(a2/a3)、
             别的 NPC(nA5)、子NPC(snA6)、跨岛 nA1 块(b3) 全留 —— **不再按 rootOf 一锅端**；
           · forgetCharSet({charIds:[fA1,snA1]},sbA) 清 a2(a6)：皮套+子NPC 一起，同 root
             别的皮套 fA2(a3)、跨岛 fA1 块(b1) 留；
           · forgetCharSet({charIds:[rA,fA1,fA2,nA1,nA2,snA1]},sbA) 清 a1..a6：大号+全部皮套+
             全部子NPC 按岛清，a7(uA)与跨岛 b1/b2/b3 留；
           · forgetUser(uA,sbA) 清 a7，b4 留（同 uid 别岛保留）；
           · 空集合 / 无命中 resolve 0。 */
      var dbP = await openDB('sleepy-vec', 6);
      await putBlocks(dbP, [
        /* sbA：目标岛 —— charId=rootOf(产出方)，fromCharId=产出方 */
        p4blk({ id: 'a1', ownerKey: 'rA', charId: 'rA', fromCharId: 'rA', sandboxId: 'sbA' }),   /* 大号自己 */
        p4blk({ id: 'a2', ownerKey: 'rA', charId: 'rA', fromCharId: 'fA1', sandboxId: 'sbA' }),  /* 皮套 fA1 */
        p4blk({ id: 'a3', ownerKey: 'rA', charId: 'rA', fromCharId: 'fA2', sandboxId: 'sbA' }),  /* 皮套 fA2 */
        p4blk({ id: 'a4', ownerKey: 'rA', charId: 'rA', fromCharId: 'nA1', sandboxId: 'sbA' }),  /* NPC nA1 */
        p4blk({ id: 'a5', ownerKey: 'rA', charId: 'rA', fromCharId: 'nA2', sandboxId: 'sbA' }),  /* NPC nA2 */
        p4blk({ id: 'a6', ownerKey: 'fA1', charId: 'fA1', fromCharId: 'snA1', sandboxId: 'sbA' }), /* 皮套 fA1 下的子NPC snA1 */
        p4blk({ id: 'a7', ownerKey: 'user:uA', charId: null, userId: 'uA', sandboxId: 'sbA' }),  /* 马甲 uA 日记 */
        /* sbB：参照岛 —— 含 rA 系的跨岛块 */
        p4blk({ id: 'b1', ownerKey: 'rA', charId: 'rA', fromCharId: 'fA1', sandboxId: 'sbB' }),  /* fA1 在 B */
        p4blk({ id: 'b2', ownerKey: 'rA', charId: 'rA', fromCharId: 'rA', sandboxId: 'sbB' }),   /* rA 在 B */
        p4blk({ id: 'b3', ownerKey: 'rA', charId: 'rA', fromCharId: 'nA1', sandboxId: 'sbB' }),  /* nA1 在 B */
        p4blk({ id: 'b4', ownerKey: 'user:uB', charId: null, userId: 'uB', sandboxId: 'sbB' })   /* uB 日记 */
      ]);
      dbP.close();
      lsClearVec();
    } else if (c === 'hold') {
      /* 两标签页阻塞：本页持有 v5 连接**不关** */
      var db3 = await openDB('sleepy-vec', 5);
      await putBlocks(db3, [blk('old1', 'fA', 'sb1'), blk('old2', 'fB', 'sb1')]);
      window.__hold = db3;
      lsClearVec();
    } else if (c === 'upgrade2') {
      /* 阻塞场景的第二页：库已由 hold 页造好，这里只清痕迹 */
      lsClearVec();
    } else if (c === 'plain') {
      /* 不做任何布置：用于「升级完成后重载页面」的状态复查 */
    } else if (c === 'p2') {
      /* 项目 2：干净库 —— 删库重造 v6，localStorage 清干净。 */
      await new Promise(function (res) { var r = indexedDB.deleteDatabase('sleepy-vec'); r.onsuccess = r.onerror = r.onblocked = res; });
      lsClearVec();
    }
  })();

  /* 生产脚本顺序注入（store.js → memory-vec.js），同源生产原文。
     带 cache-bust：system Edge 有时会缓存旧版 <script>（即使 no-store），
     导致加载的 memory-vec.js 不是最新（缺 charMemOff 等挂载）。加时间戳强制拿最新。 */
  window.__loadScript = function (src) {
    return new Promise(function (res, rej) {
      var s = document.createElement('script');
      s.src = src + (src.indexOf('?') >= 0 ? '&' : '?') + '_cb=' + Date.now();
      s.onload = res;
      s.onerror = function () { rej(new Error('加载失败：' + src)); };
      document.head.appendChild(s);
    });
  };

  /* 环境桩：core（身份/岛）、singleApi、api（embedding mock —— 不产生真实费用） */
  window.__embedCount = {};
  window.__allowB = true;
  window.__setupEnv = function () {
    var Sleepy = window.Sleepy;
    /* 名册里放「主角 + 一个生产形态真实 NPC」：
       NPC 用 upsertChar({kind:'npc', parentType:'sandbox'}) 会生成 `chxxx` id（不是 npc 前缀）——
       这正是项目 2 修复要覆盖的形态。桩的 core 提供 findChar（按 id 查 kind），
       与生产 charConfig 用 kind 判 isNpc 完全同源。 */
    var roster = [
      { id: 'c1', kind: 'main', name: '主角甲', parentId: null, parentType: 'char' },
      { id: 'r1', kind: 'main', name: '主角R1', parentId: null, parentType: 'char' },
      { id: 'r2', kind: 'main', name: '主角R2', parentId: null, parentType: 'char' },
      { id: 'A', kind: 'main', name: '成员A', parentId: null, parentType: 'char' },
      { id: 'B', kind: 'main', name: '成员B', parentId: null, parentType: 'char' },
      { id: 'mA', kind: 'main', name: '马甲A', parentId: null, parentType: 'char' },
      { id: 'mB', kind: 'main', name: '马甲B', parentId: null, parentType: 'char' },
      { id: 'chNPC0001', kind: 'npc', name: '真实NPC', parentId: 'sb1', parentType: 'sandbox' }
    ];
    /* 供测试模拟「core 未就绪」：__dropCore() 摘掉 Sleepy.core 上的 findChar/rootIdOf，
       让 isNpcRoot 走「core 未就绪」分支；__restoreCore() 装回来。 */
    function installCore() {
      var sidSeq = 0;
      Sleepy.core = {
        rootIdOf: function (id) { return id; },
        scopeId: function () { return 'sb1'; },
        scoped: function (x) { return x; },
        newId: function (p) { return (p || 'id') + (Date.now().toString(36)) + (++sidSeq).toString(36); },
        /* 与生产 core.tagScope 同义：盖 sandboxId 章（清空/解散群按章过滤） */
        tagScope: function (o) { if (o && typeof o === 'object') o.sandboxId = 'sb1'; return o; },
        findUser: function () { return { id: 'u1', name: '梦梦' }; },
        initialOf: function (name) { return String(name || '?').slice(0, 1); },
        initialOfUser: function (name) { return String(name || '?').slice(0, 1); },
        charsOfSandbox: function () { return [{ id: 'c1' }]; },
        npcsOfRoom: function () { return [{ id: 'chNPC0001', kind: 'npc' }]; },
        findChar: function (id) {
          for (var i = 0; i < roster.length; i++) if (roster[i].id === id) return roster[i];
          return null;
        }
      };
    }
    installCore();
    window.__dropCore = function () {
      /* 仅保留无关字段，去掉 rootIdOf / findChar / scopeId —— 模拟核心未挂上 */
      Sleepy.core = { scopeId: function () { return 'sb1'; } };
    };
    window.__restoreCore = function () { installCore(); };
    Sleepy.singleApi = { cfgOf: function () { return { baseUrl: 'http://stub', model: 'emb-test' }; } };
    Sleepy.api = {
      embed: function (cfg, texts) {
        if (!window.__allowB && texts.some(function (t) { return t.indexOf('B话') >= 0; })) {
          return Promise.resolve({ ok: false, error: '模拟注入失败' });
        }
        texts.forEach(function (t) { window.__embedCount[t] = (window.__embedCount[t] || 0) + 1; });
        return Promise.resolve({ ok: true, vecs: texts.map(function () { return [0.1, 0.2]; }), dim: 2, ms: 1 });
      }
    };
    /* 项目 2：memoryStore 桩 —— charConfig 是记忆开关判据的唯一出口。
       __setCharConfig 由测试脚本驱动，模拟「对话设置页/记忆岛页」写开关。
       isNpc 判定**查名册 kind**（findChar），不猜 id 前缀 —— 与生产 page-memory.js
       修复同源，保证 `ch` 前缀的真实 NPC 也默认关。
       isNpcRoot 与生产**逐字同步**：共享池前缀永远 false、core 未就绪/查不到不默认关。 */
    var byChar = window.__memCharConfig || {};
    window.__setCharConfig = function (root, enabled) { byChar[root] = enabled; };
    window.__clearCharConfig = function () { byChar = {}; };
    function isNpcRoot(root) {
      if (/^(island:|user:|group:)/.test(root || '')) return false;  /* 共享池永远非 NPC */
      if (!Sleepy.core || !Sleepy.core.findChar) return false;        /* 未知不默认关 */
      var c = Sleepy.core.findChar(root);
      return !!(c && c.kind === 'npc');                              /* 名册为准 */
    }
    Sleepy.memoryStore = {
      charConfig: function (charId) {
        var root = (Sleepy.core && Sleepy.core.rootIdOf)
          ? (Sleepy.core.rootIdOf(charId) || charId) : charId;
        var v = byChar[root];
        /* 显式配置**优先**（用户拍板：已有 enabled:true / enabled:false 不被默认覆盖）：
           只有「无 byChar[root] 记录」的真实 NPC 才默认关。 */
        if (v === false) return { enabled: false };
        if (v === true) return { enabled: true };
        var isNpc = isNpcRoot(root);
        return { enabled: isNpc ? false : true };   /* 无显式 → NPC 默认关、主角默认开 */
      }
    };
  };

  window.__boot = (async function () {
    await window.__pre;
    await window.__loadScript('/store.js');
    await window.__loadScript('/memory-vec.js');
    await window.__loadScript('/core-group.js');
    window.__setupEnv();
    window.__loaded = true;
  })().catch(function (e) { window.__bootError = String(e && e.message || e); });
})();
</script>
</body>
</html>
