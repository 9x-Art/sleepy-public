<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>项目5 · 真机验收 · 种子与报告（隔离测试页）</title>
<style>
  body { font: 15px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
         margin: 0; padding: 16px; background: #FFFFFF; color: #1a1a1a; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: #888; font-size: 13px; margin-bottom: 14px; word-break: break-all; }
  .btns { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  button { border: 0; padding: 14px 16px; font-size: 15px; text-align: left;
           background: #B08A5E; color: #fff; border-radius: 10px; }
  button.ghost { background: #F3EEE7; color: #6b5a44; }
  button:active { opacity: .8; }
  pre { font: 12.5px/1.55 ui-monospace, Consolas, monospace; background: #F7F5F2;
        padding: 12px; border-radius: 10px; white-space: pre-wrap; word-break: break-all; margin: 0; }
  .ok { color: #1a7f37; } .bad { color: #c62828; } .dim { color: #888; }
</style>
</head>
<body>
<!-- ============================================================
     preview/phone-test/index.html — 真机验收 · 种子与报告页
     · 手机没有控制台：所有原本要看 Console 的数字都打在屏幕上，直接截图回交；
     · 纯隔离：只碰本页面同源下的 sleepy-vec 库与 sleepy.v1.* 的 vec/charMem
       过程键；**不加载任何生产脚本**（报告路径零副作用）；
     · 用途对照：
         布置 v5 隔离存档 → 第 1 步（v5→v6 升级）
         布置全新库       → 第 1 步对照（全新库不得误报）
         占住 v5 连接     → 第 8 步（B4-b 两标签页）
     · 部署安全：preview/ 整目录在 deploy.sh 的 --exclude 清单里，不会上线。
     ============================================================ -->
<h1>项目 5 · 真机验收</h1>
<div class="sub" id="meta"></div>

<div class="btns">
  <button id="seed5">① 布置 v5 隔离存档（第 1 步 · 升级用）</button>
  <button id="seedFresh" class="ghost">② 布置全新库 · 对照（不得误报）</button>
  <button id="hold5" class="ghost">③ 占住 v5 连接（第 8 步 B4-b 用）</button>
  <button id="release" class="ghost">④ 释放占住的连接</button>
  <button id="dlStep2" class="ghost">⑤ 下载第 2 步备份（导入用）</button>
  <button id="dlStep5" class="ghost">⑦ 下载第 5 步备份（导入用）</button>
  <button id="seedMigMerged" class="ghost">⑧ 布置迁移中断·merged（第 5 步 A）</button>
  <button id="seedMigVerified" class="ghost">⑨ 布置迁移中断·verified（第 5 步 B）</button>
  <button id="report">⑥ 刷新报告（只读，不改任何数据）</button>
  <button id="reportP2" class="ghost">⑩ 项目2 · 记忆开关报告（只读，不改任何数据）</button>
</div>

<pre id="log">（操作日志）</pre>
<pre id="out">（报告会出现在这里，进页面自动跑一次）</pre>
<pre id="out2">（项目2 · 记忆开关报告会出现在这里，点「⑩」）</pre>

<script>
(function () {
  'use strict';
  var NS = 'sleepy.v1.';
  var DB = 'sleepy-vec';
  var held = null;   /* B4-b 占住的连接 */

  var $ = function (id) { return document.getElementById(id); };
  function meta() {
    $('meta').textContent = '来源 ' + location.origin +
      ' · ' + new Date().toLocaleString() + ' · 本页不加载生产脚本，只读写测试库';
  }
  function say(msg, cls) {
    var line = document.createElement('div');
    if (cls) line.className = cls;
    line.textContent = msg;
    $('log').appendChild(line);
  }
  $('log').textContent = '';

  /* ---------- IDB 小工具 ---------- */
  /* 删库：{ok:true} 删掉了；{blocked:true} 被别的标签页占着。
     ⚠ Android Edge 被挡时 onblocked 不触发（验收-项目5 原生实测）→
     必须加超时兜底，不然「先删旧库…」会永远停在原地。 */
  function delDB() {
    return new Promise(function (res) {
      var done = false;
      var finish = function (x) { if (!done) { done = true; res(x); } };
      var r = indexedDB.deleteDatabase(DB);
      r.onsuccess = function () { finish({ ok: true }); };
      r.onerror = function () { finish({ ok: true }); };
      r.onblocked = function () { finish({ blocked: true }); };
      setTimeout(function () { finish({ blocked: true }); }, 3000);
    });
  }
  function openVer(v, upgrade) {
    return new Promise(function (res, rej) {
      var r = indexedDB.open(DB, v);
      r.onupgradeneeded = function () { if (upgrade) upgrade(r.result, r); };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
      r.onblocked = function () { rej(new Error('open 被别的标签页挡住（onblocked）')); };
    });
  }
  /* v5 形状的块：没有 fromCharId（那是 v6 才加的）、charId 直接记脸 */
  function blkV5(id, owner, ch, sb, kind) {
    return { id: id, ownerKey: owner, charId: ch, sandboxId: sb, kind: kind,
             msgIds: [id], text: 'v5旧块·' + id + '·验收种子', vec: [0.1, 0.2],
             model: 'emb-seed', at: Date.now() };
  }
  function clearVecTraces() {
    var doomed = [];
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (!k || k.indexOf(NS) !== 0) continue;
      var bare = k.slice(NS.length);
      if (bare === 'vecRebuild' || bare === 'vecDbVer' || bare === 'vecEpoch' ||
          bare.indexOf('vecCursor') === 0 || bare.indexOf('vecFail:') === 0) doomed.push(k);
    }
    doomed.forEach(function (k) { localStorage.removeItem(k); });
    return doomed.length;
  }
  function putBlocks(db, recs) {
    return new Promise(function (res, rej) {
      var t = db.transaction('vec', 'readwrite');
      var os = t.objectStore('vec');
      recs.forEach(function (r) { os.put(r); });
      t.oncomplete = function () { res(true); };
      t.onerror = function () { rej(t.error); };
    });
  }

  /* ---------- 按钮 ---------- */
  $('seed5').onclick = function () {
    (async function () {
      say('布置 v5：先删旧库…');
      var d = await delDB();
      if (d.blocked) {
        say('⚠ 删库被挡：有别的标签页占着向量库（多半是小手机还开着）。', 'bad');
        say('　 把小手机的所有标签页全关掉，回本页刷新，再按一次「①」。', 'bad');
        return;
      }
      var db = await openVer(5, function (db) {
        var os = db.createObjectStore('vec', { keyPath: 'id' });
        os.createIndex('ownerKey', 'ownerKey');
        os.createIndex('at', 'at');
      });
      await putBlocks(db, [
        blkV5('seed-old1', 'r1', 'c1', 'sb1', 'chat'),
        blkV5('seed-old2', 'r1', 'c1', 'sb1', 'chat'),
        blkV5('seed-old3', 'r1', 'c1', 'sb1', 'mem')
      ]);
      db.close();
      var n = clearVecTraces();
      say('✅ v5 隔离存档已布置：3 个旧块（无 fromCharId，v5 形状）；清掉 vec 痕迹键 ' + n + ' 个。', 'ok');
      say('下一步：打开小手机首页 → 设置 → 其他能力 → 向量记忆 API。', 'dim');
      report();
    })().catch(function (e) { say('❌ 失败：' + (e && e.message || e), 'bad'); });
  };

  $('seedFresh').onclick = function () {
    (async function () {
      say('布置全新库：删库 + 清痕迹…');
      var d = await delDB();
      if (d.blocked) {
        say('⚠ 删库被挡：有别的标签页占着向量库（多半是小手机还开着）。', 'bad');
        say('　 把小手机的所有标签页全关掉，回本页刷新，再按一次「②」。', 'bad');
        return;
      }
      var n = clearVecTraces();
      say('✅ 全新库已布置：sleepy-vec 不存在；清掉 vec 痕迹键 ' + n + ' 个。', 'ok');
      say('下一步：打开小手机首页 → 向量记忆 API 页，**不应**出现「需要重建」提示。', 'dim');
      report();
    })().catch(function (e) { say('❌ 失败：' + (e && e.message || e), 'bad'); });
  };

  $('hold5').onclick = function () {
    (async function () {
      if (held) { say('已经占着一条 v5 连接了（先点「释放」）。'); return; }
      var d = await delDB();
      if (d.blocked) {
        say('⚠ 删库被挡：有别的标签页占着向量库（多半是小手机还开着）。', 'bad');
        say('　 把小手机的所有标签页全关掉，回本页刷新，再按一次「③」。', 'bad');
        return;
      }
      var db = await openVer(5, function (db) {
        var os = db.createObjectStore('vec', { keyPath: 'id' });
        os.createIndex('ownerKey', 'ownerKey');
        os.createIndex('at', 'at');
      });
      await putBlocks(db, [blkV5('seed-old1', 'r1', 'c1', 'sb1', 'chat')]);
      held = db;
      clearVecTraces();
      say('✅ 本页已占住 v5 连接（不关）。保持本页开着，去新标签页打开小手机首页，观察它的表现。', 'ok');
    })().catch(function (e) { say('❌ 失败：' + (e && e.message || e), 'bad'); });
  };

  $('release').onclick = function () {
    if (!held) { say('没有占住的连接。'); return; }
    held.close(); held = null;
    say('✅ 已释放。被挡住的升级应在此刻自动继续。', 'ok');
  };

  /* ---------- 报告（纯只读） ---------- */
  function lsBare(key) {
    var v = localStorage.getItem(NS + key);
    if (v == null) return null;
    try { return JSON.parse(v); } catch (e) { return v; }
  }
  function lsScan(filter) {
    var out = [];
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k && k.indexOf(NS) === 0 && filter(k.slice(NS.length))) out.push(k.slice(NS.length));
    }
    return out.sort();
  }
  function inspectIDB() {
    return new Promise(function (res) {
      var r = indexedDB.open(DB);   /* 不带版本号：绝不触发升级 */
      var done = false;
      var finish = function (x) { if (!done) { done = true; res(x); } };
      r.onupgradeneeded = function () {
        /* 库不存在时 open 会新建 v1 —— 那说明之前根本没有库 */
        r.transaction.abort();
        finish({ exists: false });
      };
      r.onsuccess = function () {
        var db = r.result;
        var ver = db.version;
        if (!db.objectStoreNames.contains('vec')) { db.close(); finish({ exists: true, ver: ver, noStore: true }); return; }
        var t = db.transaction('vec', 'readonly');
        var os = t.objectStore('vec');
        var total = 0, byOwner = {}, sample = [];
        var creq = os.openCursor();
        creq.onsuccess = function () {
          var c = creq.result;
          if (!c) { db.close(); finish({ exists: true, ver: ver, total: total, byOwner: byOwner, sample: sample }); return; }
          total++;
          var b = c.value || {};
          var ok = String(b.ownerKey || '(空)');
          byOwner[ok] = (byOwner[ok] || 0) + 1;
          if (sample.length < 5) sample.push({ id: b.id, ownerKey: b.ownerKey, kind: b.kind,
                                               hasFromCharId: ('fromCharId' in b),
                                               text: String(b.text || '').slice(0, 50) });
          c.continue();
        };
        creq.onerror = function () { db.close(); finish({ exists: true, ver: ver, err: String(creq.error) }); };
      };
      r.onerror = function () { finish({ exists: false, err: String(r.error) }); };
      r.onblocked = function () { finish({ exists: true, blocked: true }); };
    });
  }
  async function report() {
    meta();
    var idb = await inspectIDB();
    var L = [];
    L.push('—— 报告 · ' + new Date().toLocaleTimeString() + ' ——');
    L.push('来源 ' + location.origin);
    L.push('');
    L.push('【向量库 sleepy-vec】');
    if (!idb.exists) L.push('  库不存在（全新状态）');
    else {
      L.push('  版本 = ' + idb.ver + '（6 = 已升级；5 = 还是旧库）');
      if (idb.noStore) L.push('  没有 vec store');
      else if (idb.blocked) L.push('  ⚠ 被别的标签页挡住，读不到');
      else {
        L.push('  块总数 = ' + idb.total + (idb.total === 0 ? '  ← 升级后应为 0' : ''));
        var owners = Object.keys(idb.byOwner || {});
        owners.forEach(function (o) { L.push('    ' + o + ' = ' + idb.byOwner[o]); });
        (idb.sample || []).forEach(function (s) {
          L.push('    样本 ' + s.id + ' kind=' + s.kind + ' fromCharId字段=' + (s.hasFromCharId ? '有(v6形状)' : '无(v5形状)'));
          if (s.text) L.push('      文本：' + s.text + (s.text.length >= 50 ? '…' : ''));
        });
      }
    }
    L.push('');
    L.push('【重建提示 vecRebuild】' + JSON.stringify(lsBare('vecRebuild')));
    L.push('【vecDbVer】' + JSON.stringify(lsBare('vecDbVer')));
    var cursors = lsScan(function (k) { return k.indexOf('vecCursor') === 0; });
    var fails = lsScan(function (k) { return k.indexOf('vecFail:') === 0; });
    L.push('【游标键 vecCursor*】' + cursors.length + ' 个' + (cursors.length ? '：' + cursors.join('、') : ''));
    L.push('【失败键 vecFail:*】' + fails.length + ' 个' + (fails.length ? '：' + fails.join('、') : ''));
    var mig = lsBare('charMemMigrationState');
    L.push('');
    L.push('【迁移状态 charMemMigrationState】' + JSON.stringify(mig));
    L.push('【迁移完成标记 charMemMigrated】' + JSON.stringify(lsBare('charMemMigrated')));
    var backups = lsScan(function (k) { return k.indexOf('charMemBackup:') === 0; });
    L.push('【迁移备份 charMemBackup:*】' + backups.length + ' 份');
    var srcs = lsScan(function (k) { return k.indexOf('charMem:') === 0; });
    L.push('【charMem:* 键】' + srcs.length + ' 个' + (srcs.length ? '：' + srcs.join('、') : '') +
      (srcs.length ? '  ← 迁移完成后应只剩 root 门牌' : ''));
    var peeks = lsScan(function (k) { return k.indexOf('diaryPeek:') === 0; });
    L.push('【diaryPeek:* 键】' + peeks.length + ' 个' + (peeks.length ? '：' + peeks.join('、') : ''));
    $('out').textContent = L.join('\n');
  }
  $('report').onclick = function () { $('log').textContent = ''; report(); };

  /* 第 2 步备份下载：blob 方式落成文件，导入备份的文件选择器才好挑 */
  $('dlStep2').onclick = function () {
    (async function () {
      var r = await fetch('step2-backup.json');
      if (!r.ok) throw new Error('HTTP ' + r.status);
      var b = await r.blob();
      var a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = 'sleepy-accept-step2.json';
      document.body.appendChild(a); a.click(); a.remove();
      say('✅ 备份开始下载（下载列表里找 sleepy-accept-step2.json）', 'ok');
    })().catch(function (e) { say('❌ 下载失败：' + (e && e.message || e), 'bad'); });
  };

  $('dlStep5').onclick = function () {
    (async function () {
      var r = await fetch('step5-backup.json');
      if (!r.ok) throw new Error('HTTP ' + r.status);
      var b = await r.blob();
      var a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = 'sleepy-accept-step5.json';
      document.body.appendChild(a); a.click(); a.remove();
      say('✅ 备份开始下载（下载列表里找 sleepy-accept-step5.json）', 'ok');
    })().catch(function (e) { say('❌ 下载失败：' + (e && e.message || e), 'bad'); });
  };

  /* ---------- 第 5 步：迁移中断现场（merged / verified 两档） ----------
     迁移本身几毫秒跑完，「杀页面」造不出中途现场 —— 直接布置持久化的
     charMemMigrationState + 备份 + 源键（与桩测试 W19 同一套场景，
     但在真浏览器里走启动恢复）。靠名册里 kind=sub 的脸定位 face/root。 */
  function migTargets() {
    var chars = [];
    try { chars = JSON.parse(localStorage.getItem(NS + 'characters') || '[]') || []; } catch (e) { chars = []; }
    var face = null;
    for (var i = 0; i < chars.length; i++) {
      if (chars[i] && chars[i].kind === 'sub' && chars[i].parentId) { face = chars[i]; break; }
    }
    if (!face) return null;
    var root = null;
    for (var j = 0; j < chars.length; j++) {
      if (chars[j] && chars[j].id === face.parentId) { root = chars[j]; break; }
    }
    if (!root) return null;
    return { face: face.id, root: root.id };
  }
  function migCleanSlate() {
    var doomed = [];
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (!k || k.indexOf(NS) !== 0) continue;
      var b = k.slice(NS.length);
      if (b === 'charMemMigrated' || b === 'charMemMigrationState' ||
          b.indexOf('charMem:') === 0 || b.indexOf('charMemBackup:') === 0 ||
          b.indexOf('diaryPeek:') === 0 || b === 'memoryIsland') doomed.push(k);
    }
    doomed.forEach(function (k) { localStorage.removeItem(k); });
  }
  function migScene(phase) {
    var t = migTargets();
    if (!t) {
      say('❌ 名册里找不到皮套（kind=sub）——先导入第 5 步备份（⑦）。', 'bad');
      return;
    }
    migCleanSlate();
    var now = Date.now();
    var iso = function (off) { return new Date(now - (off || 0)).toISOString(); };
    /* 备份（= 迁移动手前的原样） */
    var preRoot = { version: '1', charId: t.root, updatedAt: iso(86400000), understandings: [],
      memories: [{ id: 'r1', charId: t.root, kind: 'habit',
        content: 'root 独有条目', status: 'active', updatedAt: iso(86400000) }] };
    var preFace = { version: '1', charId: t.face, updatedAt: iso(86400000), understandings: [],
      memories: [
        { id: 'a1', charId: t.face, kind: 'user_fact',
          content: '皮套条目甲', status: 'active', updatedAt: iso(172800000) },
        { id: 'a2', charId: t.face, kind: 'promise',
          content: '皮套条目乙', status: 'active', updatedAt: iso(86400000) }
      ] };
    var preIsland = { name: '星屿', type: 'solo', byChar: {} };
    preIsland.byChar[t.face] = { enabled: true, level: 3, updatedAt: iso(86400000) };
    var peekFlag = { on: true, updatedAt: iso(86400000) };
    /* 「合并已经写进去」的样子（merged/verified 都停在这一步之后） */
    var mergedRoot = JSON.parse(JSON.stringify(preRoot));
    preFace.memories.forEach(function (m) {
      var c = JSON.parse(JSON.stringify(m)); c.fromCharId = t.face; mergedRoot.memories.push(c);
    });
    mergedRoot.memories.forEach(function (m) { if (m.fromCharId === undefined) m.fromCharId = t.root; });
    mergedRoot.updatedAt = iso(0);
    /* 相位语义（照 page-memory.js migRun 的真实顺序）：
       ④ charMem 合并 → merged →（岛设置 / 旗子搬移）→ ⑤ 校验 → verified → ⑥ 删源键。
       · merged  现场：charMem 已合并，岛设置/旗子**还没搬**；
       · verified 现场：全都搬完、校验过了，**源键还没删**。 */
    /* 落盘：备份 → 中断现场 */
    var backupKey = 'charMemBackup:' + now;
    var backup = { at: now, txn: 'mig-seed-' + phase, data: {} };
    backup.data['charMem:' + t.root] = preRoot;
    backup.data['charMem:' + t.face] = preFace;
    backup.data['memoryIsland'] = preIsland;
    backup.data['diaryPeek:' + t.face] = peekFlag;
    backup.data['diaryPeek:' + t.root] = undefined;   /* 预像：root 名下还没有 */
    localStorage.setItem(NS + backupKey, JSON.stringify(backup));
    localStorage.setItem(NS + 'charMem:' + t.root, JSON.stringify(mergedRoot));
    localStorage.setItem(NS + 'charMem:' + t.face, JSON.stringify(preFace));  /* 源键还没删 */
    if (phase === 'merged') {
      localStorage.setItem(NS + 'memoryIsland', JSON.stringify(preIsland));       /* 还没搬 */
      localStorage.setItem(NS + 'diaryPeek:' + t.face, JSON.stringify(peekFlag)); /* 还没搬 */
    } else {
      var movedIsland = { name: '星屿', type: 'solo', byChar: {} };
      movedIsland.byChar[t.root] = { enabled: true, level: 3, updatedAt: iso(0) }; /* face 条目已删 */
      localStorage.setItem(NS + 'memoryIsland', JSON.stringify(movedIsland));
      localStorage.setItem(NS + 'diaryPeek:' + t.root, JSON.stringify(peekFlag)); /* 已搬 */
      localStorage.setItem(NS + 'diaryPeek:' + t.face, JSON.stringify(peekFlag)); /* 源键还没删 */
    }
    localStorage.setItem(NS + 'charMemMigrationState', JSON.stringify({
      txn: 'mig-seed-' + phase, phase: phase, backupKey: backupKey,
      affectedRoots: [t.root],
      sources: ['charMem:' + t.face, 'diaryPeek:' + t.face],
      startedAt: iso(2000), updatedAt: iso(0)
    }));
    say('✅ 现场已布置：phase=' + phase + '（root=' + t.root.slice(0, 8) + '… face=' + t.face.slice(0, 8) + '…）', 'ok');
    say('下一步：打开小手机首页（触发启动恢复）→ 回种子页「⑥ 刷新报告」。', 'dim');
    report();
  }
  $('seedMigMerged').onclick = function () {
    try { migScene('merged'); } catch (e) { say('❌ ' + (e && e.message || e), 'bad'); }
  };
  $('seedMigVerified').onclick = function () {
    try { migScene('verified'); } catch (e) { say('❌ ' + (e && e.message || e), 'bad'); }
  };

  /* ---------- 项目2 · 记忆开关报告（纯只读） ----------
     数据来源（与生产 memory-vec.js / page-memory.js 同一套键）：
       · 开关态   = store 'memoryIsland' 的 byChar[*].enabled（false=关）
                   isNpc 判定 = rootId 以 'npc' 开头；无记录时主角默认开、NPC 默认关
       · 定向世代 = localStorage 'vecEpoch4:<root>'（setCharConfig false→true 时 +1）
       · 全局世代 = localStorage 'vecEpoch'
       · 向量块   = IDB 'sleepy-vec' 的 'vec' store，按 ownerKey 前缀分类：
                    裸 rootId → 角色私有池(rootOf)；'island:' → 岛池；
                    'user:' → 账号池；'group:' → 群池
       · 失败退避 = localStorage 'vecFail:*'（embedding 失败；空 = 没有失败）
    用途：真机第 2/3/5/6/7 步的硬数字截图回交。
    只读：不删库、不改块、不动任何键。 */
  function poolClass(ownerKey) {
    var s = String(ownerKey || '');
    if (s.indexOf('island:') === 0) return '岛池';
    if (s.indexOf('user:') === 0) return '账号池';
    if (s.indexOf('group:') === 0) return '群池';
    if (s) return '角色私有池';
    return '(空)';
  }
  async function reportP2() {
    meta();
    var idb = await inspectIDB();
    var L = [];
    L.push('—— 项目2 · 记忆开关报告 · ' + new Date().toLocaleTimeString() + ' ——');
    L.push('来源 ' + location.origin);
    L.push('');

    /* 1) 开关态：memoryIsland.byChar（含名册全部角色 → 无记录也按默认态显示）
       名册角色未必在 byChar 里（无记录 = 走默认：主角开 / NPC 关）——
       恰好第 1 步要验的就是「默认态」，所以必须把无记录的也列出来。 */
    L.push('【开关态 memoryIsland.byChar[*].enabled · 含默认态】');
    var island = lsBare('memoryIsland');
    var byChar = (island && island.byChar) || {};
    var roster = [];
    try { roster = lsBare('characters') || []; } catch (e) { roster = []; }
    if (!Array.isArray(roster)) roster = [];
    var map = {};
    roster.forEach(function (c) { if (c && c.id) map[c.id] = c.name || ''; });
    Object.keys(byChar).forEach(function (r) { if (!map[r]) map[r] = ''; });  /* byChar 里的额外键也列出 */
    var keys = Object.keys(map);
    if (!keys.length) L.push('  (名册为空且无记录 —— 开关会走默认：主角开、NPC 关)');
    else keys.sort().forEach(function (root) {
      var c = byChar[root] || {};
      var isNpc = String(root).indexOf('npc') === 0;
      /* 生效态 = 与生产 charConfig 一致：有记录 → enabled!==false；无记录 → 主角开 / NPC 关 */
      var en = c.enabled !== undefined ? (c.enabled !== false) : (!isNpc);
      L.push('  ' + (map[root] ? map[root] + ' ' : '') + root.slice(0, 24) +
        ' · ' + (en ? '开' : '关') + (c.enabled === undefined ? '（无记录→' + (isNpc ? 'NPC默认关' : '主角默认开') + '）' : '') +
        '  level=' + (c.level || (isNpc ? 'off' : 'full')));
    });
    L.push('');

    /* 2) 定向世代 vecEpoch4:<root> + 全局 vecEpoch */
    var e4 = lsScan(function (k) { return k.indexOf('vecEpoch4:') === 0; });
    L.push('【定向世代 vecEpoch4:<root>】' + (e4.length ? '' : '0 个（默认 = 无定向世代，即未重开过）'));
    e4.forEach(function (k) { L.push('  ' + k + ' = ' + JSON.stringify(lsBare(k))); });
    L.push('【全局世代 vecEpoch】' + JSON.stringify(lsBare('vecEpoch')));
    L.push('');

    /* 3) 向量库 ownerKey 分块 */
    L.push('【向量库 sleepy-vec 分块（按池）】');
    if (!idb.exists) L.push('  库不存在（全新状态 —— 关闭时一库未建就是对的）');
    else if (idb.noStore) L.push('  没有 vec store');
    else if (idb.blocked) L.push('  ⚠ 被别的标签页挡住，读不到');
    else {
      L.push('  版本 = ' + idb.ver + ' · 块总数 = ' + idb.total);
      var owners = Object.keys(idb.byOwner || {});
      if (!owners.length) L.push('  (0 块 —— 关闭停建/清空后应为 0)');
      owners.sort().forEach(function (o) {
        L.push('  ' + poolClass(o) + ' ' + o + ' = ' + idb.byOwner[o]);
      });
    }
    L.push('');

    /* 4) 失败退避 + 游标 */
    var fails = lsScan(function (k) { return k.indexOf('vecFail:') === 0; });
    L.push('【失败退避 vecFail:*】' + fails.length + ' 个' +
      (fails.length ? '  ← 关闭停建期间应为 0（一个 embedding 都不该调）' : ''));
    var cursors = lsScan(function (k) { return k.indexOf('vecCursor') === 0; });
    L.push('【游标 vecCursor*】' + cursors.length + ' 个' +
      (cursors.length ? '：' + cursors.join('、') : ''));
    L.push('');
    L.push('判读速记：');
    L.push('  关 → 聊新消息：角色私有池块数应 0 增、vecFail 应 0；共享池照常增；');
    L.push('  重开(false→true)：目标 root 的 vecEpoch4 应 +1（其它 root/共享池不动）。');
    $('out2').textContent = L.join('\n');
  }
  $('reportP2').onclick = function () { $('log').textContent = ''; reportP2(); };

  meta();
  report();
})();
</script>
