  }

  .phone[data-theme="glass"]::after {
    content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.16), inset 0 -1px 0 rgba(255,255,255,.045);
  }

  .phone[data-theme="mist"] .spot {
    background: radial-gradient(circle, rgba(255,255,255,.95) 0%, rgba(255,255,255,.35) 36%, rgba(255,255,255,0) 70%);

  .phone[data-theme="mist"]::after {
    content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.95), inset 0 -1px 0 rgba(255,255,255,.55);
  }

  .spot {
    position: absolute; left: 50%; top: 46%;
    width: 190%; height: 190%; margin-left: -95%; margin-top: -95%;
    border-radius: 50%; pointer-events: none;

  .sub { position: absolute; left: 0; right: 0; top: 55%; text-align: center; opacity: 0; font-size: .5em; letter-spacing: .3em; text-indent: .3em; }

  .note { font-size: 12px; color: #5e564b; line-height: 1.7; }

              { opacity: 1, transform: 'translateY(-50%) scale(1)' },
              { opacity: 0, transform: 'translateY(-50%) scale(.95)' }
            ], { duration: 700 });
            if (echo) anim(echo, [{ opacity: .6 }, { opacity: 0 }], { duration: 700 });

            T(function () {
              phone.appendChild(lg);
              if (sb) phone.appendChild(sb);

              anim(phone, [{ backgroundColor: TH.bg }, { backgroundColor: TH.dawnBg }], { duration: 800, easing: 'ease-in-out' });
              anim(stage, [{ opacity: 1 }, { opacity: 0 }], { duration: 800 });
              anim(glow, [{ opacity: 1 }, { opacity: 0 }], { duration: 800 });
              anim(spot, [
                { transform: 'scale(1.5)', opacity: .8 },
                { transform: 'scale(1)', opacity: 0 }
              ], { duration: 800 });

              T(function () {
                anim(lg, [
                  { opacity: 0, transform: 'translateY(10px)', color: TH.dawnLogo },
                  { opacity: 1, transform: 'translateY(0)', color: TH.dawnLogo }
                ], { duration: 1200 });
                if (sb) {
                  anim(sb, [
                    { opacity: 0, transform: 'translateY(8px)', color: TH.dawnLogo },
                    { opacity: .7, transform: 'translateY(0)', color: TH.dawnLogo }
                  ], { duration: 1000, delay: 240 });
                }
              }, 800);
            }, 760);
          }, 2000);
        } else {
          phone.appendChild(lg);
          if (sb) phone.appendChild(sb);
          T(function () {
            anim(spot, [
              { transform: 'scale(1.35)', opacity: .5 },
              { transform: 'scale(1)', opacity: 1 }
            ], { duration: 1300 });
            anim(lg, [
              { opacity: 0, transform: 'translateY(12px)' },
              { opacity: 1, transform: 'translateY(0)' }
            ], { duration: 1000 });
            if (sb) {
              anim(sb, [
                { opacity: 0, transform: 'translateY(8px)' },
                { opacity: .7, transform: 'translateY(0)' }
              ], { duration: 1000, delay: 200 });
            }
          }, 1100);
          T(function () {
            anim(slogan, [{ opacity: 1 }, { opacity: 0, transform: 'translateY(-50%) scale(1.04)' }], { duration: 800, delay: 1400 });
            if (echo) anim(echo, [{ opacity: .6 }, { opacity: 0 }], { duration: 800, delay: 1400 });
          }, 1100);
        }
      }, 380);
    }, delay);
  }

  function runScatter() {
    reset();
    var W = phone.clientWidth, H = phone.clientHeight;
    var items = [];
    SCATTER.forEach(function (B) {
      var slot = document.createElement('div');
      slot.className = 'slot';
      slot.style.left = B.x + '%';
      slot.style.top = B.y + '%';
      var w = document.createElement('span');
      w.className = 'w serif' + (B.sm ? ' sm' : '') + (B.vert ? ' vert' : '') + (B.up ? ' up' : '');
      w.textContent = B.t;
      slot.appendChild(w);
      phone.appendChild(slot);
      items.push({ w: w, B: B });
    });

    var t0 = 700, gap = 270, dur = 1150;
    items.forEach(function (it, i) {
      var Dx = (50 - it.B.x) / 100 * W;
      var Dy = (50 - it.B.y) / 100 * H;
      T(function () {
        anim(it.w, [
          { opacity: 0, transform: 'translate(' + Dx + 'px,' + Dy + 'px) scale(.42)', filter: 'blur(9px)' },
          { opacity: it.B.o, transform: 'translate(0px,0px) scale(1)', filter: 'blur(0)' }
        ], { duration: dur });
      }, t0 + i * gap);
    });

    var end = t0 + (items.length - 1) * gap + dur + 420;
    T(function () {
      items.forEach(function (it) {
        anim(it.w, [
          { opacity: it.B.o, transform: 'translate(0,0) scale(1)', filter: 'blur(0)' },
          { opacity: 0, transform: 'translate(0,0) scale(.58)', filter: 'blur(8px)' }
        ], { duration: 560 });
      });
    }, end);
    outro(end + 560);
  }

  function runDepth() {
    reset();
    var cubes = [];
    DEPTH.forEach(function (B) {
      var el = document.createElement('div');
      el.className = 'cube';
      var inner = document.createElement('div');
      var t = document.createElement('span');
      t.className = 't serif' + (B.v ? ' v' : '');
      t.textContent = B.t;
      inner.appendChild(t);
      if (B.tr) {
        var tr = document.createElement('span');
        tr.className = 'tr';
        tr.textContent = B.tr;
        inner.appendChild(tr);
      }
      el.appendChild(inner);
      phone.appendChild(el);
      cubes.push(el);
    });
    var t0 = 200;
    cubes.forEach(function (el, i) {
      var dx = ((i % 3) - 1) * 20;
      var dy = ((i % 5) - 2) * 11;
      T(function () {
        anim(el, [
          { opacity: 0, transform: 'translate(' + dx + 'px,' + dy + 'px) scale(1.55)', filter: 'blur(9px)' },
          { opacity: 1, transform: 'translate(' + (dx * .34) + 'px,' + (dy * .34) + 'px) scale(1)', filter: 'blur(0)', offset: .24 },
          { opacity: .9, transform: 'translate(' + (dx * .12) + 'px,' + (dy * .12) + 'px) scale(.6)', filter: 'blur(2px)', offset: .66 },
          { opacity: 0, transform: 'translate(0px,0px) scale(.28)', filter: 'blur(7px)' }
        ], { duration: 1400 });
      }, t0 + i * 255);
    });
    outro(t0 + cubes.length * 255 + 780);
  }

  function runSink() {
    reset();
    var spots = [
      { y: 7, dx: -30, o: .22 }, { y: 16, dx: 30, o: .28 },
      { y: 26, dx: -32, o: .34 }, { y: 36, dx: 30, o: .40 },
      { y: 46, dx: -30, o: .46 }, { y: 56, dx: 32, o: .52 },
      { y: 66, dx: -30, o: .58 }, { y: 76, dx: 26, o: .64 },
      { y: 85, dx: -18, o: .70 }
    ];
    var nodes = [];
    var t = 140;
    spots.forEach(function (s, i) {
      var el = document.createElement('div');
      el.className = 'fall serif';
      el.textContent = SINK[i].t;
      el.style.top = s.y + '%';
      el.style.marginLeft = s.dx + 'px';
      phone.appendChild(el);
      nodes.push({ el: el, o: s.o });
      T(function () {
        anim(el, [
          { opacity: 0, transform: 'translateY(-50%) translateY(-46px)', filter: 'blur(6px)' },
          { opacity: s.o, transform: 'translateY(-50%)', filter: 'blur(0)' }
        ], { duration: 620, easing: 'cubic-bezier(.34,1.3,.5,1)' });
      }, t);
      t += 150;
    });
    T(function () {
      nodes.forEach(function (n) {
        anim(n.el, [
          { opacity: n.o, transform: 'translateY(-50%)' },
          { opacity: 0, transform: 'translateY(-50%) translateY(-96px)' }
        ], { duration: 900, delay: 200 });
      });
    }, t + 420);
    outro(t + 420 + 620);
  }

  function run() {
    if (mode === 'depth') runDepth();
    else if (mode === 'sink') runSink();
    else runScatter();
  }

  function pick(sel, fn) {
    document.querySelectorAll(sel).forEach(function (b) {
      b.addEventListener('click', function () {
        document.querySelectorAll(sel).forEach(function (x) { x.classList.remove('on'); });
        b.classList.add('on');
        fn(b);
        run();
      });
    });
  }

  pick('.panel [data-mode]', function (b) { mode = b.dataset.mode; });
  pick('.panel [data-theme]', function (b) { theme = b.dataset.theme; phone.dataset.theme = theme; });
  pick('.panel [data-dawn]', function (b) { dawn = b.dataset.dawn === '1'; });
  pick('.panel [data-end]', function (b) { ei = parseInt(b.dataset.end, 10); });
  pick('.panel [data-font]', function (b) { font = b.dataset.font; });

  $('#replay').addEventListener('click', run);

  line = $('.line');
  author = $('.author');
  slogan = $('.slogan');
  phone = $('.phone');
  glow = $('.glow');
  stage = $('.stage');
  spot = $('.spot');

  run();
})();
</script>

</body>
</html>
