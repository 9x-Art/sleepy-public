<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- 主题色跟着 app 的纯白底走。原来是 #1E1B2E（旧深紫皮肤），
     加到主屏后启动画面和窗口标题栏会是一块深紫，跟里面的白底完全两回事。 -->
<meta name="theme-color" content="#FFFFFF">
<title>Sleepy</title>
<!-- PWA：加到主屏后全屏独立窗口跑；SW 只在 http(s) 下注册（file:// 天然全离线） -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">

<!-- 亚克力挂件灯的引擎映射。
     灯的核心（vendor/acrylic-lamp-core.js）是 ES module，里面写的是
     `import * as THREE from 'three'`，靠这张表把裸名 "three" 指到本地文件。
     **路径是相对页面（index.html）的，不是相对 core 的** —— 以后把文件挪走，
     这里要跟着改。

     为什么用本地文件而不是 CDN：这个项目从第一天起就是「离线优先」，
     学校网络里外网也不稳；671 KB 的文件放本地，断网、内网都照跑。
     gzip 之后只有 166 KB。

     注意 importmap 必须出现在**任何 module 加载之前**，所以它放在 head 里。 -->
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
</head>
<body>

<div id="phone">

  <!-- 开屏预遮罩（见 splash.js）。**为什么要有它**：splash.js 排在所有脚本最后
       （要等 bootHome 把桌面渲染完，摘遮罩那一下才不白屏），所以它执行之前
       浏览器已经把桌面画出来了 —— 探针实测：桌面 742ms 渲染完、遮罩 881ms 才插进来，
       中间那一百多毫秒用户看到的是空桌面，像是「先闪一下主页，然后黑掉开始动画」。
       在这儿先写死一层夜色，**第一帧就是夜色**；splash.js 执行时把它升级成 #splash。

       ⚠️ 行内样式只服务于"第一帧"，接管后一律走 style.css 的 #splash
       （别在这儿改配色/加样式，否则又是两份）。 -->
  <div id="splash-pre" aria-hidden="true" style="position:absolute;inset:0;z-index:300;background:#0B1220"></div>

  <!-- 青提玻璃的极光底色。放在所有层最下面，不跟着页面滚动 -->
  <div class="ambient" aria-hidden="true"><div class="ambient-3"></div></div>

  <div id="statusbar">
    <span id="sb-time">--:--</span>
    <span class="sb-right">
      <span id="sb-battery">--</span>
    </span>
  </div>

  <div id="stack">

    <!-- 首页＝桌面（模块 H）。4 屏网格由 page-desktop.js 渲染，
         这里只留一个空壳 —— 位置数据在 store 的 desktop 里，
         不在 HTML 里写死（C2 要求：App 位置必须数据化）。 -->
    <section class="page page-home is-active" data-page="home"></section>

  </div>

</div>

<!-- 加载顺序即依赖顺序，不要调换：store → core（世界观数据层）→ ui（组件层）→ app（壳子/页面栈）→ 各页面 -->
<script src="store.js" defer></script>
<script src="core.js" defer></script>
<script src="ui.js" defer></script>
<script src="app.js" defer></script>
<script src="api.js" defer></script>
<!-- 二进制仓库（IndexedDB）：照片 / 附件 / 表情包的图片本体都存这儿，
     localStorage 里只留一个 mediaId。必须排在 photos.js 前面。 -->
<script src="media.js" defer></script>
<!-- 照片数据层：负一屏的照片墙和相册 App 共用同一份数据。
     必须排在 page-desktop.js 之前，因为后者的 wall 组件要调它 -->
<script src="photos.js" defer></script>
<!-- 桌面（模块 H）。它注册的是 'home'，所以要在 app.js 之后、别的页面之前 -->
<script src="page-desktop.js" defer></script>
<!-- 系统级切号 / 面具轮盘 / 记忆认知层。它要给 'home' 的 render 包一层，
     所以必须排在 page-desktop.js 后面；chat 页要调它的 API，也要排在 page-chat 前 -->
<script src="page-switch.js" defer></script>
<!-- 预设注入引擎（第一轮）：prompt-engine 是数据与装配核心，
     page-presets 是它的配置 app。都排在 page-chat 前 —— 后者要调引擎。 -->
<script src="prompt-engine.js" defer></script>
<script src="page-presets.js" defer></script>
<script src="page-settings.js" defer></script>
<!-- 外观（配色 / 字号 / 动效）：数据在 appearance 键里，这里负责落到 DOM。
     排在哪都行，但 app 启动时会调一次 Sleepy.appearance.apply()，
     所以它得排在 app.js 的启动流程之前 —— 也就是在 body 里、app.js 之后。 -->
<script src="page-appearance.js" defer></script>
<!-- 组件商城：读 desktop 的默认户型当目录，读 desktopRemoved 当「你删过的」。
     必须在 page-desktop.js 之后（要用它的 defaultDesktop / COLS / ROWS）。 -->
<script src="page-widgetstore.js" defer></script>
<script src="page-backup.js" defer></script>
<script src="page-subapi.js" defer></script>
<!-- 单份接口配置（总结 API / 向量记忆 API）：它们和副 API **完全独立**，
     只是「新增副 API 时顺手带一份进来」。所以必须排在 page-subapi 之后。 -->
<script src="page-singleapi.js" defer></script>
<!-- 生图（2.16）：imggen 是引擎（数据 + 拼提示词 + 调接口），
     要用 store 和 media（图库收图）；page-imggen 是设置页，
     依赖 imggen 的出口，必须排在它后面 -->
<script src="imggen.js" defer></script>
<script src="page-imggen.js" defer></script>
<!-- 语音 TTS（2.15）：tts.js 是统一层（契约类型 / 语音导演规则版 / 服务商 Adapter /
     可注入 transport），page-tts 是设置页与角色语音页。
     只依赖 store（把音频存进图库那一步才用 media），排在这儿就够；
     page-chat 要用它挂语音条与手动朗读，所以必须排在 page-chat 之前。 -->
<script src="tts.js" defer></script>
<script src="tts-director.js" defer></script>
<script src="page-tts.js" defer></script>
<!-- 名片夹（模块 I）：树状层级 + 认知矩阵。必须排在 page-chat 之前，
     因为后者要读它的角色数据 -->
<script src="page-idcard.js" defer></script>
<!-- 浮岛（造物主层）：名片夹的进化版，已取代名片夹的树状列表页。
     它要用 page-idcard 暴露的 Sleepy.charIO（导入导出的入口在配置台），
     所以排在后面 -->
<script src="page-island.js" defer></script>
<!-- 世界书（模块 B）：设置里挂入口，排在 contacts 后面无所谓 -->
<script src="page-worldbook.js" defer></script>
<!-- 心声是模块 E，page-chat 要用它的 overlay，所以排在 page-chat 之前 -->
<script src="page-heartbeat.js" defer></script>
<script src="page-diary.js" defer></script>
<script src="page-moments.js" defer></script>
<!-- 朋友圈里「角色自己动」：自己发动态 / 回来评论 / 回我发的那条。
     排在 page-moments 后面（它要用 momentsTab 的 add / addComment / canSee），
     也排在 api.js 后面（要打模型）。 -->
<script src="moments-ai.js" defer></script>
<!-- L1.5 近期生活动态（v5 §L1.5）：角色「近期实际看见」的跨 App 事件。
     排在 page-moments 后面（它惰性取 momentsTab 的 listForChar / canCharSee），
     排哪都行 —— 装配时才用。 -->
<script src="life-feed.js" defer></script>
<!-- L4 动态检索层（向量记忆，v5 §L4）：IndexedDB 索引 + 召回。
     排在 api.js / page-singleapi.js 后面（要 embed + 读向量接口配置），
     prompt-engine 那边惰性取（装配时才用），所以位置不敏感。 -->
<script src="memory-vec.js" defer></script>
<!-- 相册（模块 J）：和负一屏照片墙共用 Sleepy.photos -->
<script src="page-gallery.js" defer></script>
<!-- 译文块（组件）：线上私聊 / 线下私聊 / 群线下**共用一份实现**，
     所以排在三个页面之前。依赖 ui.js 的 h，语言与开关在运行时
     从 calendar 惰性取（calendar.js 排在后面，不影响）。 -->
<script src="msg-trans.js" defer></script>
<script src="page-chat.js" defer></script>
<!-- 线上群聊（实施总纲 v1）：core-group 是群数据层（本体/账号两层模型，
     消息单列一张表），page-group 是建群流程 + 群消息页 + 群详情页。
     群数据层只用 core 的作用域纪律，排在 core 之后即可；
     页面要读 chat 列表的入口（消息 tab 挂群入口），排在 page-chat 后。 -->
<script src="core-group.js" defer></script>
<script src="page-group.js" defer></script>
<!-- 群聊调度引擎（阶段 D/E）：普通轮次单调用（调度+发言）、输出校验、
     波次续聊与 user 抢占。要打模型，排在 api.js / prompt-engine.js 后；
     用 groupStore，排在 core-group.js 后。 -->
<script src="page-group-ai.js" defer></script>
<!-- 线下模式（Chat 内的第二空间）：数据层 + 入口页 + 场景页。
     Prompt 装配走 prompt-engine.assembleOffline，所以排在它后面。 -->
<script src="page-offline.js" defer></script>
<script src="page-group-offline.js" defer></script>
<!-- 钱包（流水从对话消息里扫）与表情包管理（聊天 App「我」那一屏的两个入口） -->
<script src="page-wallet.js" defer></script>
<script src="page-stickers.js" defer></script>
<!-- 聊天 App 容器（4 Tab：消息 / 通讯录 / 朋友圈 / 我）。
     它是壳，内容由 page-chat（消息）、page-moments（朋友圈）、
     page-switch（我）各自提供，所以必须排在它们后面。
     另外它注册 chat-list / moments / me 三个入口 id ——
     这三个页面 id 在别的文件里**已经不再注册**了，别加回去。 -->
<script src="page-app.js" defer></script>
<!-- 对话设置 / 挑角色的浮层：要用 page-chat 暴露的 chatStore，所以排在它后面。
     文件末尾还有一段「点火」（Sleepy.bootHome），要保持最后加载。 -->
<script src="page-chat-settings.js" defer></script>
<script src="page-char-appearance.js" defer></script>
<script src="page-memory.js" defer></script>
<script src="page-summary.js" defer></script>
<script src="page-proactive.js" defer></script>
<!-- 查手机系统：phone.js 只依赖 store/core，page-phone.js 要用 chatStore
     （镜像真实聊天）和 core-group（群岛群聊），排在它们之后。
     page-phone-ai.js 是生成链（结算/冷启动），要走 prompt-engine 的卡和
     offlineStore 的模型候选，排最后。 -->
<script src="phone.js" defer></script>
<script src="page-phone.js" defer></script>
<script src="page-phone-ai.js" defer></script>
<!-- App 工坊（第 4 批）：要用 phone.ensurePhone（安装时建壳）和 island 的
     charsOfSandbox，排最后；同名 registry 覆盖 page-phone.js 里的门面。 -->
<script src="page-workshop.js" defer></script>

<!-- 日历（《日历系统 · 产品与实施总纲 v1》）：
     calendar-data.js 是内置离线数据包（必须是 .js —— file:// 下 fetch json
     会被 CORS 拦死），calendar.js 是数据层（0 模型调用），
     page-calendar.js 是页面。数据层要读 memoryStore 与 core，
     两个都只取函数引用、在调用时才解引用，所以排这里也安全；
     页面排在 page-desktop.js 之后，桌面那格才点得开。 -->
<script src="calendar-data.js" defer></script>
<script src="calendar.js" defer></script>
<script src="page-calendar.js" defer></script>

<!-- 帷境（Veilscape）——《帷境总体设计目标与实施意图总纲 v1》+ 8 张 Demo。
     wj-data.js 是数据层（**0 模型调用**，对齐 calendar.js 那条红线），
     wj-prompt.js 装配提示词（0 网络请求）、wj-check.js 五层八股检查器（0 API，本地），
     wj-engine.js 生成状态机（真打模型，必须排在 api.js / prompt-engine.js 之后），
     页面按依赖排：门厅在最前（详情页与创建页借用它的 wjUI 小工具），
     阅读页在详情页之后，创建流程最后（它要跳文风设置台，两边的 params 约定写在各自文件头）。
     入口在桌面主屏第 6 行的通栏卡（defaultDesktop 里 type:'wj'）。 -->
<script src="wj-data.js" defer></script>
<script src="wj-prompt.js" defer></script>
<script src="wj-check.js" defer></script>
<script src="wj-coread.js" defer></script>
<!-- 正史审阅的数据层（T7）：**唯一**会把作品写进现实的地方。
     写入落点是 memoryStore / calendar（都是运行时惰性取，所以加载顺序不敏感）。 -->
<script src="wj-canon.js" defer></script>
<script src="wj-engine.js" defer></script>
<script src="page-wj-foyer.js" defer></script>
<script src="page-wj-work.js" defer></script>
<script src="page-wj-read.js" defer></script>
<script src="page-wj-coread.js" defer></script>
<!-- 谢幕页（T6）：五路去向下挂在详情页的「谢幕」上。
     它同时导出聊天里那两种卡片（wj-share / wj-invite），
     聊天页**惰性取**（本文件在 page-chat.js 之后加载）。 -->
<script src="page-wj-curtain.js" defer></script>
<!-- 正史审阅台（T7）：四步 stepper。入口在谢幕页的「进入正史审阅」那一张卡。 -->
<script src="page-wj-canon.js" defer></script>
<script src="page-wj-style.js" defer></script>
<script src="page-wj-create.js" defer></script>
<!-- We（关系沉淀空间）：依赖 core（指针卫兵）、calendar（timeFacts/upcoming）、
     life-feed（recent）、favorites（收藏数量）。日历排在它之前已加载，所以这里
     排在 page-wj-create 之后即可；它注册 'we' 入口，桌面那格才点得开。 -->
<script src="page-we.js" defer></script>
<!-- We 收藏馆 P2（提议确认流）：char 提议的独立 scoped store + 唯一读写出口
     （extractTag / validateSource / createFromReply / accept / decline）。
     依赖 page-we.js（weStore.add / KINDS）与 calendar（来源核验）；
     page-chat（标签抽取+提议卡）与 page-collection（待确认条）运行时惰性取。 -->
<script src="page-we-proposal.js" defer></script>
<!-- We 收藏馆（门厅 + 藏品详情）：依赖 page-we.js 导出的 weStore（kind 兼容）。
     注册 'collection' 页，We 首页「去收藏馆 →」打开它。不占桌面格。 -->
<script src="page-collection.js" defer></script>
<!-- 开屏（冷启动遮罩）。**必须排最后**：page-chat-settings.js 末尾的
     Sleepy.bootHome() 已经跑过，桌面渲染完成，遮罩下面是有内容的，
     摘掉遮罩那一下才不会白屏。 -->
<script src="splash.js" defer></script>

<script>
/* boot 期错误可视化（2026-09-26 真机 8-B 白屏排查加的）：
   手机没控制台，boot 期炸了就是白屏、死无对证 —— 把 JS 错误 / Promise 拒绝
   画成屏幕顶部的红条，截图即可回交。
   只在**加载后 20 秒内**画（boot 窗口）；过了窗口的异常走页面错误边界，
   不打扰正常使用。放在 SW 注册脚本旁边，不改它本身。 */
window.__bootErr = function (msg) {
  var b = document.getElementById('boot-err-banner');
  if (!b) {
    b = document.createElement('pre');
    b.id = 'boot-err-banner';
    b.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;' +
      'background:#c62828;color:#fff;font:12px/1.5 monospace;padding:8px 10px;' +
      'white-space:pre-wrap;word-break:break-all;margin:0;';
    (document.body || document.documentElement).appendChild(b);
  }
  b.textContent += '\n' + msg;
};
(function () {
  var bootWindow = Date.now() + 20000;
  function paint(kind, msg) {
    if (Date.now() > bootWindow) return;
    try { window.__bootErr(kind + ' ' + msg); } catch (e) { /* 画不了就算了 */ }
  }
  window.addEventListener('error', function (e) {
    paint('JS错误:', (e && e.message) + ' @' + (e && e.filename ? e.filename.split('/').pop() : '?') + ':' + (e && e.lineno));
  });
  window.addEventListener('unhandledrejection', function (e) {
    var r = e && e.reason;
    paint('Promise拒绝:', (r && (r.message || r.why)) || String(r));
  });
})();
</script>

<script>
/* PWA：只在 http(s) 下注册 SW。file:// 双击打开本来就是全离线的，
   注册反而报错；装到主屏（走 serve.js 或托管）之后这里才生效。

**本地开发服务器（127.0.0.1 / localhost）跳过注册** —— 这是一条
2026-09-17 加上的护栏，起因是改样式时反复「改了没反应」：
sw.js 是「缓存优先 + 后台更新」，所以刷新拿到的永远是**上一版**
style.css，改十次也只在第二次刷新后才看见，白白怀疑了半天缓存、
选择器、优先级。指向 127.0.0.1 的页面本来也装不了 PWA（手机打开
127.0.0.1 是手机自己），所以跳过它没有任何代价。 */
var devHost = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !devHost) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js')['catch'](function () { /* 静默失败 */ });
  });
}
</script>
</body>
</html>
