<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1E1B2E">
<title>Sleepy</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="phone">

  <div id="statusbar">
    <span id="sb-time">--:--</span>
    <span class="sb-right">
      <span id="sb-battery">--</span>
    </span>
  </div>

  <div id="stack">

    <section class="page page-home is-active" data-page="home">
      <header class="greet">
        <p class="greet-title">晚安，睡睡</p>
        <p class="greet-sub">今天的本子已经贴好了</p>
      </header>

      <div class="grid">

        <!-- 图标统一线性 SVG：24 格、currentColor、线宽 1.6，和聊天页顶栏/加号面板同一套 -->
        <button class="icon" data-app="chat-list">
          <span class="ic">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4.5 6.8A2.3 2.3 0 0 1 6.8 4.5h10.4a2.3 2.3 0 0 1 2.3 2.3v7.4a2.3 2.3 0 0 1-2.3 2.3H10l-4.2 3.2a.55.55 0 0 1-.88-.44z"/>
              <path d="M8.5 9.3h7M8.5 12.3h4.5"/>
            </svg>
          </span>
          <span class="ic-name">聊天</span>
        </button>

        <button class="icon" data-app="moments">
          <span class="ic">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3.5" y="7.5" width="12" height="10" rx="1.5"/>
              <path d="M8 7.5V6A1.5 1.5 0 0 1 9.5 4.5h9A1.5 1.5 0 0 1 20 6v8a1.5 1.5 0 0 1-1.5 1.5H16"/>
              <path d="M6.5 14.5l2.5-2.5 2 2 1.5-1.5 2 2"/>
            </svg>
          </span>
          <span class="ic-name">朋友圈</span>
        </button>

        <button class="icon" data-app="diary">
          <span class="ic">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="5" y="4" width="14.5" height="16" rx="2"/>
              <path d="M9 4v16"/>
              <path d="M12.5 8.5H16M12.5 12h3.5"/>
            </svg>
          </span>
          <span class="ic-name">日记</span>
        </button>

        <button class="icon" data-app="memory">
          <span class="ic">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="4" y="5" width="16" height="14" rx="2"/>
              <circle cx="9" cy="9.5" r="1.4"/>
              <path d="M6.5 16l3.5-3.5 2.5 2.5 2-2 3 3"/>
            </svg>
          </span>
          <span class="ic-name">记忆</span>
        </button>

        <button class="icon" data-app="music">
          <span class="ic">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3.5" y="6" width="17" height="12" rx="2"/>
              <circle cx="9" cy="12" r="1.7"/>
              <circle cx="15" cy="12" r="1.7"/>
              <path d="M9 15.5h6"/>
            </svg>
          </span>
          <span class="ic-name">音乐</span>
        </button>

        <button class="icon" data-app="contacts">
          <span class="ic">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="4" y="5.5" width="16" height="13" rx="2"/>
              <circle cx="9" cy="10.5" r="1.8"/>
              <path d="M13.5 9h3.5M13.5 12h3.5M7 15.5h10"/>
            </svg>
          </span>
          <span class="ic-name">名片夹</span>
        </button>

        <button class="icon" data-app="worldbook">
          <span class="ic">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 6.6C10.6 5.2 8.6 4.6 5.5 4.6v13.2c3.1 0 5.1.6 6.5 2 1.4-1.4 3.4-2 6.5-2V4.6c-3.1 0-5.1.6-6.5 2z"/>
              <path d="M12 6.6v13.2"/>
            </svg>
          </span>
          <span class="ic-name">世界书</span>
        </button>

      </div>

      <nav class="dock">
        <button class="dock-btn" data-app="chat-list">
          <span class="dock-ic">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4.5 6.8A2.3 2.3 0 0 1 6.8 4.5h10.4a2.3 2.3 0 0 1 2.3 2.3v7.4a2.3 2.3 0 0 1-2.3 2.3H10l-4.2 3.2a.55.55 0 0 1-.88-.44z"/>
              <path d="M8.5 9.3h7M8.5 12.3h4.5"/>
            </svg>
          </span>
          <span class="dock-name">聊天</span>
        </button>
        <button class="dock-btn" data-app="settings">
          <span class="dock-ic">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="3.1"/>
              <path d="M12 3.4v2.3M12 18.3v2.3M20.6 12h-2.3M5.7 12H3.4"/>
              <path d="M18.1 5.9l-1.6 1.6M7.5 16.5l-1.6 1.6M18.1 18.1l-1.6-1.6M7.5 7.5L5.9 5.9"/>
            </svg>
          </span>
          <span class="dock-name">设置</span>
        </button>
        <button class="dock-btn" data-app="support">
          <span class="dock-ic">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 19.5C7.2 15.7 4.2 12.7 4.2 9.6c0-2.2 1.7-3.9 3.8-3.9 1.5 0 2.9.8 4 2.2 1.1-1.4 2.5-2.2 4-2.2 2.1 0 3.8 1.7 3.8 3.9 0 3.1-3 6.1-7.8 9.9z"/>
            </svg>
          </span>
          <span class="dock-name">反馈</span>
        </button>
      </nav>
    </section>

  </div>

  <div id="edge-hint"></div>

</div>

<!-- 加载顺序即依赖顺序，不要调换：store → ui（组件层）→ app（壳子/页面栈）→ 各页面 -->
<script src="store.js"></script>
<script src="ui.js"></script>
<script src="app.js"></script>
<script src="api.js"></script>
<script src="page-settings.js"></script>
<script src="page-backup.js"></script>
<script src="page-subapi.js"></script>
<script src="page-contacts.js"></script>
<!-- 世界书（模块 B）：设置里挂入口，排在 contacts 后面无所谓，但必须在 page-chat 之前没什么依赖，放这里保持「先资料后聊天」的顺序 -->
<script src="page-worldbook.js"></script>
<!-- 心声是模块 E，page-chat 要用它的 overlay，所以排在 page-chat 之前 -->
<script src="page-heartbeat.js"></script>
<script src="page-diary.js"></script>
<script src="page-moments.js"></script>
<script src="page-chat.js"></script>
<!-- 对话设置 / 挑角色的浮层：要用 page-chat 暴露的 chatStore，所以排在它后面 -->
<script src="page-chat-settings.js"></script>
</body>
</html>
