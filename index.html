<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1E1B2E">
<title>Sleepy</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="phone">

  <div id="statusbar">
    <span id="sb-time">--:--</span>
    <span class="sb-right">
      <span id="sb-battery">--</span>
    </span>
  </div>

  <div id="stack">

    <section class="page page-home is-active" data-page="home">
      <header class="greet">
        <p class="greet-title">晚安，睡睡</p>
        <p class="greet-sub">今天的本子已经贴好了</p>
      </header>

      <div class="grid">

        <button class="icon" data-app="chat-list">
          <span class="ic">
            <svg viewBox="0 0 40 40" aria-hidden="true">
              <g transform="rotate(-3 20 20)">
                <rect x="6" y="5" width="29" height="30" rx="2" fill="#F2E8DC"/>
                <path d="M29 35 L35 29 L35 35 Z" fill="#D6C7AC"/>
                <line x1="11" y1="14" x2="29" y2="14" stroke="#C9BBA6" stroke-width="1.6"/>
                <line x1="11" y1="20" x2="26" y2="20" stroke="#C9BBA6" stroke-width="1.6"/>
                <line x1="11" y1="26" x2="22" y2="26" stroke="#C9BBA6" stroke-width="1.6"/>
              </g>
            </svg>
            <span class="tape" style="--tape:#F4A29C; --tape-r:-14deg;"></span>
          </span>
          <span class="ic-name">聊天</span>
        </button>

        <button class="icon" data-app="moments">
          <span class="ic">
            <svg viewBox="0 0 40 40" aria-hidden="true">
              <rect x="4" y="10" width="26" height="21" rx="2" fill="#F4C4BE" transform="rotate(-5 18 20)"/>
              <rect x="10" y="11" width="26" height="21" rx="2" fill="#A3B899" transform="rotate(4 23 22)"/>
              <line x1="15" y1="21" x2="31" y2="20" stroke="#7F9670" stroke-width="1.3" transform="rotate(4 23 22)"/>
              <line x1="15" y1="26" x2="27" y2="25" stroke="#7F9670" stroke-width="1.3" transform="rotate(4 23 22)"/>
            </svg>
            <span class="tape" style="--tape:#E8B87B; --tape-r:8deg;"></span>
          </span>
          <span class="ic-name">朋友圈</span>
        </button>

        <button class="icon" data-app="diary">
          <span class="ic">
            <svg viewBox="0 0 40 40" aria-hidden="true">
              <g transform="rotate(2 20 20)">
                <rect x="8" y="4" width="25" height="32" rx="2" fill="#7A5C4A"/>
                <rect x="8" y="19" width="25" height="5" fill="#C9A961"/>
                <line x1="13" y1="4" x2="13" y2="36" stroke="#5E4536" stroke-width="2"/>
              </g>
            </svg>
            <span class="tape" style="--tape:#F2E8DC; --tape-r:-6deg;"></span>
          </span>
          <span class="ic-name">日记</span>
        </button>

        <button class="icon" data-app="memory">
          <span class="ic">
            <svg viewBox="0 0 40 40" aria-hidden="true">
              <g transform="rotate(-2 20 20)">
                <rect x="6" y="6" width="28" height="28" rx="2" fill="#8FA9C4"/>
                <rect x="13" y="13" width="16" height="13" rx="1" fill="#F2E8DC"/>
                <path d="M6 12 L12 6 L12 12 Z" fill="#6E88A3"/>
                <path d="M34 28 L28 34 L28 28 Z" fill="#6E88A3"/>
              </g>
            </svg>
            <span class="tape" style="--tape:#F4A29C; --tape-r:10deg;"></span>
          </span>
          <span class="ic-name">记忆</span>
        </button>

        <button class="icon" data-app="music">
          <span class="ic">
            <svg viewBox="0 0 40 40" aria-hidden="true">
              <rect x="3" y="10" width="34" height="22" rx="3" fill="#3A3550" transform="rotate(-1 20 21)"/>
              <circle cx="14" cy="21" r="4.5" fill="#F2E8DC"/>
              <circle cx="26" cy="21" r="4.5" fill="#F2E8DC"/>
              <rect x="17.5" y="19.5" width="6" height="3" fill="#E8B87B"/>
            </svg>
            <span class="tape" style="--tape:#E8B87B; --tape-r:5deg;"></span>
          </span>
          <span class="ic-name">音乐</span>
        </button>

        <button class="icon" data-app="contacts">
          <span class="ic">
            <svg viewBox="0 0 40 40" aria-hidden="true">
              <g transform="rotate(3 20 20)">
                <rect x="5" y="6" width="30" height="28" rx="2" fill="#D6C7AC"/>
                <circle cx="14" cy="16" r="4" fill="#7A5C4A"/>
                <line x1="21" y1="14" x2="30" y2="14" stroke="#7A5C4A" stroke-width="1.6"/>
                <line x1="21" y1="19" x2="27" y2="19" stroke="#7A5C4A" stroke-width="1.6"/>
                <line x1="11" y1="27" x2="30" y2="27" stroke="#7A5C4A" stroke-width="1.2"/>
              </g>
            </svg>
            <span class="tape" style="--tape:#8FA9C4; --tape-r:-9deg;"></span>
          </span>
          <span class="ic-name">名片夹</span>
        </button>

      </div>

      <nav class="dock">
        <button class="dock-btn" data-app="chat-list">
          <span class="dock-ic" style="background:#F2E8DC; border-radius:4px;"></span>
          <span class="dock-name">聊天</span>
        </button>
        <button class="dock-btn" data-app="settings">
          <span class="dock-ic" style="background:#B23A2F; border-radius:50%;"></span>
          <span class="dock-name">设置</span>
        </button>
        <button class="dock-btn" data-app="support">
          <span class="dock-ic" style="background:#C9A961; border-radius:3px;"></span>
          <span class="dock-name">反馈</span>
        </button>
      </nav>
    </section>

  </div>

  <div id="edge-hint"></div>

</div>

<!-- 加载顺序即依赖顺序，不要调换：store → ui（组件层）→ app（壳子/页面栈）→ 各页面 -->
<script src="store.js"></script>
<script src="ui.js"></script>
<script src="app.js"></script>
<script src="api.js"></script>
<script src="page-settings.js"></script>
<script src="page-backup.js"></script>
<script src="page-subapi.js"></script>
<script src="page-contacts.js"></script>
<!-- 心声是模块 E，page-chat 要用它的 overlay，所以排在 page-chat 之前 -->
<script src="page-heartbeat.js"></script>
<script src="page-diary.js"></script>
<script src="page-moments.js"></script>
<script src="page-chat.js"></script>
<!-- 对话设置 / 挑角色的浮层：要用 page-chat 暴露的 chatStore，所以排在它后面 -->
<script src="page-chat-settings.js"></script>
</body>
</html>
