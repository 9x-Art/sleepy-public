name = "sleepy-repo"
main = "repo-worker.js"
compatibility_date = "2026-10-01"

# 关掉 workers.dev 公网入口（2026-11-01，worker 用量 50% 根治）：
# 机器人扫这个地址烧请求配额，请求到达 worker 就计费、内部拦截省不下。
# 正式流量全部走 Pages 同源反代（functions/[[path]].js → Service Binding）。
# ⚠️ 部署顺序：先去 Pages 后台配好 Service binding（变量名 API → sleepy-repo），
# 再跑 wrangler deploy —— 顺序反了反代兜底 fetch 的 workers.dev 会 404，主路断。
workers_dev = false

[[d1_databases]]
binding = "DB"
database_name = "sleepy-repo"
# 公开仓库占位：换成你自己的 Cloudflare D1 数据库 ID（Dashboard → D1 → 数据库详情）
database_id = "<YOUR_D1_DATABASE_ID>"

# 包体存 KV（2026-10-10：R2 要去 Dashboard 手动开通，KV 免开通且 25MB/值
# 对 5MB 上限的设定包绰绰有余）。绑定名保持 STORE，Worker 代码双兼容。
[[kv_namespaces]]
binding = "STORE"
# 公开仓库占位：换成你自己的 Cloudflare KV 命名空间 ID（Dashboard → KV → 命名空间详情）
id = "<YOUR_KV_NAMESPACE_ID>"

# 发码页营业口令（2026-10-22 收口）：secret 不进配置文件，部署后执行一次
#   wrangler secret put ISSUE_KEY
# 值 = 你发货时发给买家的那串口令。没配 = 发码页歇业（fail closed）。
# 改口令 = 重新 put 一遍即可，旧口令立刻失效。
